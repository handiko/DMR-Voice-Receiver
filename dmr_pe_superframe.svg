<text x="920.0" y="332.0" font-size="14" fill="#a3312a" font-weight="400" text-anchor="end" dominant-baseline="central">accepted here at |ρ| ≥ 0.5</text>
<text x="30.0" y="384.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Timing from burst A is good to a fraction of a symbol, and the transmitter clock is stable, so 300 ms later</text>
<text x="30.0" y="406.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">we are still on the symbol centres. Each blind burst re-measures its own gain and offset.</text>
<text x="30.0" y="444.0" font-size="14.5" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">If A is lost completely, the whole superframe is skipped: 360 ms of silence, never 360 ms of garbage.</text></svg>

<text x="806.0" y="287.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">play only i &lt; R</text>
<text x="806.0" y="306.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">clip to ±1</text>
<polyline points="896.0,296.0 960.0,296.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>

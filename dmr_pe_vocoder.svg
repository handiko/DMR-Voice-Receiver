<text x="344.0" y="121.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">mbelib-neo</text>
<text x="344.0" y="140.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">soft decision, ×3 frames</text>

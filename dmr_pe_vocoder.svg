<text x="40.0" y="284.0" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">symbol clock from the framer, 8 kHz (one output sample per input)</text>
<text x="40.0" y="360.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">progress</text>
<polyline points="30.0,376.0 464.0,376.0" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
<text x="40.0" y="392.0" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">all bursts up to p<tspan baseline-shift="sub" font-size="72%">prog</tspan> have been sent</text>
<rect x="466.0" y="344.0" width="220.0" height="64.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="576.0" y="367.0" font-size="16" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">R = (p<tspan baseline-shift="sub" font-size="72%">prog</tspan> + D·48000) / 6</text>
<text x="576.0" y="388.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">release point</text>
<polyline points="686.0,376.0 860.0,376.0 860.0,162.0" fill="none" stroke="#a3312a" stroke-width="1.3" marker-end="url(#r)"/>
<rect x="84.0" y="80.0" width="896.0" height="340.0" fill="none" stroke="#666666" stroke-width="1.0" stroke-dasharray="5 4"/>
<text x="20.0" y="448.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">D = audio delay (0.4 s). p = the burst’s sample position at 48 kS/s; six of those make one 8 kHz audio sample.</text>
<text x="20.0" y="500.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(b) The same thing on a timeline</text>

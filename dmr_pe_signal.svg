<text x="762.0" y="620.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">payload</text>
<text x="762.0" y="640.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">54 sym</text>
<text x="762.0" y="676.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">108 bits</text>
<line x1="60.0" y1="718.0" x2="60.0" y2="730.0" stroke="#1b1b1b" stroke-width="1.1"/>
<line x1="924.0" y1="718.0" x2="924.0" y2="730.0" stroke="#1b1b1b" stroke-width="1.1"/>

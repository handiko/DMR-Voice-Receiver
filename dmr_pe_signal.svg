<text x="492.0" y="740.0" font-size="13.5" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">144 symbols = 30 ms</text>
<text x="60.0" y="780.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">The sync sits in the middle, so both payload halves are equally close to where the timing is measured.</text>
<text x="60.0" y="806.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Voice: only burst A of each 360 ms superframe has a sync; bursts B–F carry a 16-bit EMB field there instead.</text>
<text x="60.0" y="832.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Data/control: payload = 196 bits of BPTC-coded data + 20 bits of slot type (10 each side of the sync).</text>
<text x="60.0" y="870.0" font-size="14" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">Data sync = voice sync with every symbol inverted.</text></svg>

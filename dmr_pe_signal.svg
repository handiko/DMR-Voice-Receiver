<text x="96.0" y="676.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">slot no., busy,</text>
<text x="96.0" y="693.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Short LC piece</text>
<rect x="132.0" y="600.0" width="324.0" height="56.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>

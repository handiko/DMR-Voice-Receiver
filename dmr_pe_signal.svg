<text x="110.0" y="360.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">4,800 symbols/s × 2 bits = 9,600 bit/s. The sync word uses only the outer levels ±3.</text>
<text x="20.0" y="408.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(b) Time: two slots take turns, 30 ms each</text>

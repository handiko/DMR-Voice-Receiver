<text x="528.0" y="640.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">24 sym</text>
<text x="528.0" y="676.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">48 bits</text>

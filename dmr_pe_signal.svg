<text x="60.0" y="524.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">A repeater sends both slots all the time (idle bursts when quiet). Each slot is a separate conversation.</text>
<text x="20.0" y="572.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(c) One 30 ms burst: 144 symbols</text>
<rect x="60.0" y="600.0" width="72.0" height="56.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="96.0" y="620.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">CACH</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="1000" height="940" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="Layer 2 decoding chains"><title>Layer 2 decoding chains</title><defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1b1b1b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#1b1b1b" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a3312a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="26.0" font-size="19" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Layer 2: taking the error protection off, layer by layer</text>
<text x="20.0" y="58.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(a) Data / control burst (sync ρ ≈ −1)</text>
<text x="70.0" y="136.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">144</text>
<rect x="20.0" y="120.0" width="100.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="70.0" y="141.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">symbols</text>
<text x="70.0" y="160.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 288 soft bits</text>
<polyline points="120.0,150.0 150.0,150.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="150.0" cy="150.0" r="3.2" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<polyline points="150.0,150.0 150.0,112.0 190.0,112.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="100.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">20</text>
<polyline points="150.0,150.0 150.0,200.0 190.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="188.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">196</text>
<rect x="192.0" y="82.0" width="170.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="277.0" y="103.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Golay (20,8)</text>
<text x="277.0" y="122.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">slot type, fixes 3 errors</text>
<polyline points="362.0,112.0 392.0,112.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="398.0" y="103.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">colour code,</text>
<text x="398.0" y="121.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">burst type</text>
<polyline points="470.0,130.0 470.0,152.0 740.0,152.0 740.0,170.0" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
<text x="605.0" y="140.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">selects mask and parser</text>
<rect x="192.0" y="170.0" width="120.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="252.0" y="191.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">BPTC Π⁻¹</text>
<text x="252.0" y="210.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">un-shuffle</text>
<polyline points="312.0,200.0 342.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="344.0" y="170.0" width="170.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="429.0" y="191.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Hamming rows + cols</text>
<text x="429.0" y="210.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">196 → 96 bits</text>
<polyline points="514.0,200.0 544.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="529.0" y="186.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">96</text>
<rect x="546.0" y="170.0" width="160.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="626.0" y="191.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">CRC-16 ⊕ mask</text>
<text x="626.0" y="210.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">or RS (12,9) for LC</text>
<polyline points="706.0,200.0 736.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="721.0" y="186.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">80</text>
<rect x="738.0" y="170.0" width="140.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="808.0" y="191.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">read fields</text>
<text x="808.0" y="210.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">CSBK, LC, headers</text>
<polyline points="878.0,200.0 925.0,200.0" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
<text x="930.0" y="200.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">text</text>
<text x="20.0" y="262.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">A burst that fails Golay, BPTC or the checksum is dropped and counted in the panel’s “rejected” line.</text>
<text x="20.0" y="318.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(b) Voice burst (sync ρ ≈ +1, or blind B–F)</text>
<rect x="20.0" y="410.0" width="100.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="70.0" y="431.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">symbols</text>
<text x="70.0" y="450.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 264 soft bits</text>
<polyline points="120.0,440.0 150.0,440.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="150.0" cy="440.0" r="3.2" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<polyline points="150.0,440.0 150.0,380.0 190.0,380.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="368.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">216</text>
<polyline points="150.0,440.0 150.0,470.0 190.0,470.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="458.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">16</text>
<polyline points="150.0,470.0 150.0,560.0 190.0,560.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="548.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">32</text>
<rect x="192.0" y="350.0" width="150.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="267.0" y="371.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">AMBE Π⁻¹</text>
<text x="267.0" y="390.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">standard interleave</text>
<polyline points="342.0,380.0 420.0,380.0" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
<line x1="367.0" y1="386.0" x2="377.0" y2="374.0" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="372.0" y="366.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">3 × 72</text>
<text x="428.0" y="371.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">to the vocoder,</text>
<text x="428.0" y="389.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">as soft bits</text>
<text x="192.0" y="424.0" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">bursts B–F only (the 48 bits at the sync position):</text>
<rect x="192.0" y="440.0" width="150.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="267.0" y="461.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">QR (16,7)</text>
<text x="267.0" y="480.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">EMB, fixes 2 errors</text>
<polyline points="342.0,470.0 372.0,470.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="378.0" y="461.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">colour code,</text>
<text x="378.0" y="479.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">which LC piece</text>
<polyline points="410.0,488.0 410.0,514.0 300.0,514.0 300.0,528.0" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#o)"/>
<rect x="192.0" y="530.0" width="150.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="267.0" y="551.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">collect B, C, D, E</text>
<text x="267.0" y="570.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">4 × 32 = 128 bits</text>
<polyline points="342.0,560.0 468.0,560.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="470.0" y="530.0" width="220.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="580.0" y="551.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Hamming (16,11) rows</text>
<text x="580.0" y="570.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">+ column parity + 5-bit sum</text>
<polyline points="690.0,560.0 720.0,560.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="726.0" y="551.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">talkgroup + source,</text>
<text x="726.0" y="569.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">repeated every 360 ms</text>
<text x="20.0" y="618.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">The embedded LC is why the decoder (and your radio) knows who is talking even if you tune in mid-call.</text>
<text x="20.0" y="670.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">(c) CACH, every 30 ms on a repeater</text>
<rect x="20.0" y="736.0" width="100.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="70.0" y="757.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">12 symbols</text>
<text x="70.0" y="776.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 24 soft bits</text>
<polyline points="120.0,766.0 150.0,766.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="150.0" cy="766.0" r="3.2" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<polyline points="150.0,766.0 150.0,726.0 190.0,726.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="714.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">7</text>
<polyline points="150.0,766.0 150.0,816.0 190.0,816.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="168.0" y="804.0" font-size="13" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">17</text>
<rect x="192.0" y="696.0" width="150.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="267.0" y="717.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Hamming (7,4)</text>
<text x="267.0" y="736.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">TACT, fixes 1 error</text>
<polyline points="342.0,726.0 372.0,726.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="378.0" y="717.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">next slot (TS1 / TS2), busy,</text>
<text x="378.0" y="735.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Short LC start / end</text>
<rect x="192.0" y="786.0" width="160.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="272.0" y="807.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">collect 4 pieces</text>
<text x="272.0" y="826.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">120 ms</text>
<polyline points="352.0,816.0 382.0,816.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="384.0" y="786.0" width="220.0" height="60.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="494.0" y="807.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="middle" dominant-baseline="central">Hamming (17,12) + CRC-8</text>
<text x="494.0" y="826.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">Short LC, 36 data bits</text>
<polyline points="604.0,816.0 634.0,816.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="640.0" y="807.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">site identity /</text>
<text x="640.0" y="825.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">slot activity</text>
<text x="20.0" y="884.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">Every decoder uses the soft symbols: a bit that read “barely +1” is the first suspect when a code finds an error.</text>
<text x="20.0" y="910.0" font-size="14" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="central">Π⁻¹ = de-interleaver (undo the shuffle).</text></svg>

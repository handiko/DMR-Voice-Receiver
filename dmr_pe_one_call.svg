<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img" aria-label="One voice call, start to finish"><title>One voice call, start to finish</title><defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1b1b1b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9" fill="none" stroke="#1b1b1b" stroke-width="1.4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a3312a"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="26.0" font-size="19" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">One call on TS1, as the decoder sees it</text>
<rect x="40.0" y="64.0" width="130.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="105.0" y="86.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="middle" dominant-baseline="central">Voice LC</text>
<text x="105.0" y="108.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">header</text>
<text x="105.0" y="126.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">data sync</text>
<rect x="170.0" y="64.0" width="190.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="265.0" y="86.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe 1</text>
<text x="265.0" y="108.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">A + blind B–F</text>
<text x="265.0" y="126.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">360 ms</text>
<rect x="360.0" y="64.0" width="190.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="455.0" y="86.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe 2</text>
<text x="455.0" y="108.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">A + blind B–F</text>
<text x="455.0" y="126.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">embedded LC</text>
<rect x="550.0" y="64.0" width="90.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="595.0" y="86.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">…</text>
<rect x="640.0" y="64.0" width="190.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="735.0" y="86.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="middle" dominant-baseline="central">Superframe n</text>
<text x="735.0" y="108.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">last speech</text>
<rect x="830.0" y="64.0" width="130.0" height="82.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="895.0" y="86.0" font-size="15" fill="#a3312a" font-weight="700" text-anchor="middle" dominant-baseline="central">Terminator</text>
<text x="895.0" y="108.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">with LC</text>
<text x="895.0" y="126.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="central">data sync</text>
<polyline points="40.0,168.0 960.0,168.0" fill="none" stroke="#1b1b1b" stroke-width="1.3" marker-end="url(#a)"/>
<text x="962.0" y="168.0" font-size="15" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central" font-family="'Times New Roman', Times, 'Liberation Serif', 'DejaVu Serif', serif" font-style="italic">t</text>
<line x1="40.0" y1="194.0" x2="960.0" y2="194.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="40.0" y="214.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Framer</text>
<text x="150.0" y="214.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">keeps the 30 ms grid; after each A, schedules B–F; expects the next A at +360 ms</text>
<line x1="40.0" y1="234.0" x2="960.0" y2="234.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="40.0" y="254.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Layer 2</text>
<text x="150.0" y="254.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">prints “CALL Group TG=… SRC=…” (from the header, or from the embedded LC if you</text>
<text x="150.0" y="275.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">tuned in late); prints “END …” at the terminator</text>
<line x1="40.0" y1="295.0" x2="960.0" y2="295.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="40.0" y="315.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">Vocoder</text>
<text x="150.0" y="315.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">new call → fresh state; 3 frames per burst → 60 ms of audio; encrypted → muted</text>
<line x1="40.0" y1="335.0" x2="960.0" y2="335.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="40.0" y="355.0" font-size="15" fill="#1b1b1b" font-weight="700" text-anchor="start" dominant-baseline="central">You hear</text>
<text x="150.0" y="355.0" font-size="14" fill="#1b1b1b" font-weight="400" text-anchor="start" dominant-baseline="central">the speech 0.4 s after it was on the air, with gaps only where bursts were really lost</text></svg>
